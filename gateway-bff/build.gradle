plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '7.0.4'
}

group = 'com.github.hownameee'
version = '0.0.1-SNAPSHOT'
description = 'UniHub Workshop Backend For Frontend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.2'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.35.0').aosp().reorderImports(false)
        importOrder('java', 'javax', 'jakarta', 'org', 'com', 'lombok', '\\#')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = providers.gradleProperty('checkstyleVersion').orElse('10.17.0').get()
    config = resources.text.fromFile(rootProject.file('configs/check-style/checkstyle.xml'))
    configDirectory = rootProject.layout.projectDirectory.dir('configs/check-style')
    showViolations = true
    ignoreFailures = false
    configProperties = [
            'checkstyle.suppressions.file': rootProject.file('configs/check-style/suppressions.xml').absolutePath
    ]
}

tasks.register('dockerBuild', Exec) {
    group = 'docker'
    description = 'Builds the gateway-bff Docker image after building the Spring Boot JAR'
    dependsOn tasks.named('bootJar')
    workingDir = projectDir
    commandLine 'docker', 'build', '-t', "gateway-bff:${version}", '.'
}
