services:
  app-backend:
    build:
      context: ./app-backend
      dockerfile: Dockerfile
    image: app-backend:latest
    container_name: app-backend
    ports:
      - "4000:4000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://app-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATA_REDIS_HOST=app-redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - app-db
      - app-redis

  app-frontend:
    build:
      context: ./app-frontend
      dockerfile: Dockerfile
    image: app-frontend:latest
    container_name: app-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  app-db:
    image: postgres:17
    container_name: app-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./app-db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./app-db/sample-data.sql:/docker-entrypoint-initdb.d/sample-data.sql
    ports:
      - "5432:5432"

  app-redis:
    image: redis:alpine
    container_name: app-redis
    ports:
      - "6379:6379"

  gateway-nginx:
    image: nginx:alpine
    container_name: gateway-nginx
    ports:
      - "80:80"
    volumes:
      - ./gateway-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - service-auth
      - app-frontend
      - gateway-bff

  service-auth:
    image: quay.io/keycloak/keycloak:latest
    container_name: service-auth
    ports:
      - "8080:8080"
    environment:
      - KC_HOSTNAME=localhost
      - KC_HTTP_RELATIVE_PATH=/auth
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
      - KC_DB_URL=jdbc:postgresql://app-db:5432/postgres
      - KC_DB=postgres
    volumes:
      - ./service-auth/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: start-dev --import-realm
    depends_on:
      - app-db

  gateway-bff:
    build:
      context: ./gateway-bff
      dockerfile: Dockerfile
    image: gateway-bff:latest
    container_name: gateway-bff
    ports:
      - "8081:8081"
    depends_on:
      - service-auth
      - app-backend

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=app-db
    depends_on:
      - app-db


