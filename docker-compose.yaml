services:
  app-backend:
    build:
      context: ./app-backend
      dockerfile: Dockerfile
    image: app-backend:0.0.1-SNAPSHOT
    deploy:
      replicas: 3
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://app-db:5432/postgres
      - SPRING_DATA_REDIS_HOST=app-redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - app-db
      - app-redis
    networks:
      - unihub-workshop-network

  app-frontend:
    build:
      context: ./app-frontend
      dockerfile: Dockerfile
    image: app-frontend:0.0.1-SNAPSHOT
    container_name: app-frontend
    networks:
      - unihub-workshop-network

  app-db:
    image: postgres:17.10-bookworm
    container_name: app-db
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./app-db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./app-db/sample-data.sql:/docker-entrypoint-initdb.d/sample-data.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - unihub-workshop-network

  app-redis:
    image: redis:8.8.0-alpine3.23
    container_name: app-redis
    networks:
      - unihub-workshop-network

  bff-redis:
    image: redis:8.8.0-alpine3.23
    container_name: bff-redis
    networks:
      - unihub-workshop-network

  gateway-nginx:
    image: nginx:1.30.4-alpine3.24
    container_name: gateway-nginx
    ports:
      - "80:80"
    volumes:
      - ./gateway-nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - service-auth
      - app-frontend
      - gateway-bff
    networks:
      - unihub-workshop-network

  service-auth:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: service-auth
    env_file:
      - ./service-auth/.env
    environment:
      - KC_HOSTNAME=localhost
      - KC_HTTP_RELATIVE_PATH=/auth
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
      - KC_DB_URL=jdbc:postgresql://app-db:5432/postgres
      - KC_DB=postgres
    volumes:
      - ./service-auth/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: start-dev --import-realm
    depends_on:
      - app-db
    networks:
      - unihub-workshop-network

  gateway-bff:
    build:
      context: ./gateway-bff
      dockerfile: Dockerfile
    image: gateway-bff:0.0.1-SNAPSHOT
    deploy:
      replicas: 2
    environment:
      - BACKEND_SERVICE_URL=http://app-backend:4000
      - SPRING_DATA_REDIS_HOST=bff-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://service-auth:8080/auth/realms/unihub
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://service-auth:8080/auth/realms/unihub/protocol/openid-connect/certs
    depends_on:
      - service-auth
      - app-backend
      - bff-redis
    networks:
      - unihub-workshop-network

volumes:
  postgres_data: {}

networks:
  unihub-workshop-network: {}
