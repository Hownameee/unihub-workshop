server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the entry document revalidated so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite asset filenames are content-hashed and can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, immutable";
        expires 1y;
    }

    # SPA history fallback: client-side routes must load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
