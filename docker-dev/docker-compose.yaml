services:
  app-db:
    image: postgres:17.10-bookworm
    container_name: app-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ../app-db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ../app-db/sample-data.sql:/docker-entrypoint-initdb.d/sample-data.sql
      - postgres_data-dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - unihub-workshop-network-dev

  adminer:
    image: adminer:5.5.0
    container_name: adminer
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=app-db
    depends_on:
      - app-db
    networks:
      - unihub-workshop-network-dev

volumes:
  postgres_data-dev: {}

networks:
  unihub-workshop-network-dev: {}
